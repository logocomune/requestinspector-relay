name: Nightly

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-develop
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build embedded web UI
        run: npm --prefix web run build

      - name: Run Go tests
        run: go test ./...

      - name: Run web tests
        run: npm --prefix web test -- --run

      - name: Check web types
        run: npm --prefix web run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Git build metadata
        id: build-metadata
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and publish nightly image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository_owner }}/requestinspector-relay:nightly
            ghcr.io/${{ github.repository_owner }}/requestinspector-relay:nightly-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.build-metadata.outputs.version }}
            BUILD_COMMIT=${{ steps.build-metadata.outputs.commit }}
            BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
